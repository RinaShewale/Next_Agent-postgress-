apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-deployment
  labels:
    app: notification-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-container

          image: notification
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000

          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: database
                  key: RABBITMQ_URL
                  

            - name: RABBITMQ_PORT
              valueFrom:
                secretKeyRef:
                  name: database
                  key: RABBITMQ_PORT

            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: google
                  key: EMAIL_USER

            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google
                  key: GOOGLE_CLIENT_ID

            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google
                  key: GOOGLE_CLIENT_SECRET

            - name: REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: google
                  key: REFRESH_TOKEN

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "300m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /_status/healthz
              port: 5000
            initialDelaySeconds: 30
            timeoutSeconds: 10

          readinessProbe:
            httpGet:
              path: /_status/readyz
              port: 5000
            initialDelaySeconds: 30
            timeoutSeconds: 10

      restartPolicy: Always
