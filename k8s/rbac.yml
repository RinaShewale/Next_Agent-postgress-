apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-manager
  namespace: default

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: resource-manager-role
  namespace: default

rules:

  # Pods
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  # Services
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  # ConfigMaps
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  # Production Build Jobs
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  # Production Deployments
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - delete

  # Production Ingress
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - create
      - delete

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: resource-manager-role-binding
  namespace: default

subjects:
  - kind: ServiceAccount
    name: resource-manager
    namespace: default

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: resource-manager-role